name: ci

on:
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - "weekly/**"
      - "docs/**"
      - "README.md"
      - "requirements.txt"
      - "00-surveys-and-foundations/**"
      - "10-image-2d/**"
      - "20-video/**"
      - "30-3d-object-asset/**"
      - "40-3d-scene/**"
      - "50-4d-dynamic-scene-world/**"
      - "90-topics/**"
      - "91-organizations/**"
      - ".github/workflows/**"

  push:
    branches:
      - main
      - master
    paths-ignore:
      - "metadata/validation/**"
      - "metadata/cache/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install locked dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q scripts tests

      - name: Run unit & integration tests (offline fixtures)
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Deterministic fast validation (no network)
        run: |
          python scripts/validate_data.py \
            --skip-network \
            --report-root "${RUNNER_TEMP}/catalog-validation"

      - name: Rebuild generated catalog & weekly archive
        run: python scripts/build.py

      - name: Check internal Markdown links
        run: python scripts/check_internal_links.py

      - name: Verify generated files have no diff
        run: |
          git diff --check
          git diff --exit-code