name: weekly-link-check

on:
  workflow_dispatch:

  schedule:
    - cron: "15 3 * * 1"

permissions:
  contents: write

concurrency:
  group: awesome-generative-models-writer
  cancel-in-progress: false

jobs:
  deep-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build searchable explorer
        run: python scripts/build_explorer.py

      - name: Run deep validation
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e

          python scripts/validate_data.py \
            --mode deep \
            --write-cache \
            --timeout 25 \
            --retries 2 \
            --workers 8

          validation_status=$?

          set -e

          echo "status=${validation_status}" >> "$GITHUB_OUTPUT"

          # 本步骤故意返回成功，让报告和缓存可以先被提交。
          exit 0

      - name: Rebuild pages with refreshed repository stats
        run: python scripts/build.py

      - name: Check internal links
        run: python scripts/check_internal_links.py

      - name: Commit validation report and refreshed stats
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No deep-validation changes to commit."
          else
            git commit -m \
              "chore: weekly validation $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Fail only on confirmed blocking errors
        if: steps.validate.outputs.status != '0'
        shell: bash
        run: |
          errors="${{ steps.validate.outputs.blocking_errors }}"
          report="${{ steps.validate.outputs.report }}"

          echo "::error title=Deep catalog validation failed::${errors:-unknown} confirmed blocking issue(s). Report: ${report:-metadata/validation/deep/latest.md}"
          exit 1