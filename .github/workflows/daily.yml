name: daily-curation

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    paths:
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/daily.yml"

  schedule:
    - cron: "25 1 * * *"

permissions:
  contents: write
  issues: write

# 所有会向 main 写入的工作流共用同一个 concurrency group。
concurrency:
  group: awesome-generative-models-writer
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Fetch candidate inbox
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_candidates.py --days 14 --issue

      - name: Validate deterministic catalog rules
        run: python scripts/validate_data.py --mode fast

      - name: Build README and generated pages
        run: python scripts/build.py

      - name: Check internal links
        run: python scripts/check_internal_links.py

      - name: Build searchable explorer
        run: python scripts/build_explorer.py

      - name: Commit generated changes
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m \
            "build: refresh catalog $(date -u +%Y-%m-%d)"
          git push