# Vocabulary and track keywords for weekly harvesting and classification.
version: 1

arxiv_categories:
  - cs.CV
  - cs.GR
  - cs.LG
  - cs.AI
  - cs.RO

generative_core_keywords:
  - diffusion
  - flow matching
  - rectified flow
  - autoregressive
  - generative model
  - image generation
  - text-to-image
  - video generation
  - text-to-video
  - image-to-video
  - 3d generation
  - text-to-3d
  - image-to-3d
  - scene generation
  - 4d generation
  - world model
  - gaussian splatting
  - neural rendering
  - synthesizer
  - synthesis

